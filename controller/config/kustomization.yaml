# maxcloud-controller: what a cluster applies, from a release tag
# (controller/vX.Y.Z). The cluster provides the rest itself:
#   - the namespace maxcloud-system
#   - Secret maxcloud-controller: UPCLOUD_TOKEN, UPCLOUD_TOKEN_EXPIRES_AT,
#     AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   - ConfigMap maxcloud-controller: MAXCLOUD_OBJECT_STORAGE_ID,
#     MAXCLOUD_S3_ENDPOINT (and optionally MAXCLOUD_S3_REGION,
#     MAXCLOUD_POSTGRES_IMAGE, MAXCLOUD_DB_STORAGE_CLASS, MAXCLOUD_PUBLIC_DOMAIN,
#     MAXCLOUD_PUBLIC_GATEWAY)
# Databases need CloudNativePG and its barman-cloud plugin in the cluster.
# The homelab's are in its infrastructure/controllers/maxcloud.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: maxcloud-system
resources:
  - crd/maxcloud.gronblom.dev_buckets.yaml
  - crd/maxcloud.gronblom.dev_databases.yaml
  - crd/maxcloud.gronblom.dev_databasebranches.yaml
  - rbac/role.yaml
  - rbac/role_binding.yaml
  - rbac/leader_election.yaml
  - manager/deployment.yaml
# The release workflow checks that this is the tag being released.
images:
  - name: ghcr.io/maxemiliang/maxcloud-controller
    newTag: 0.6.0
