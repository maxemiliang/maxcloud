---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maxcloud-controller
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - update
- apiGroups:
  - barmancloud.cnpg.io
  resources:
  - objectstores
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - maxcloud.gronblom.dev
  resources:
  - buckets
  - databasebranches
  - databases
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - maxcloud.gronblom.dev
  resources:
  - buckets/finalizers
  - databases/finalizers
  verbs:
  - update
- apiGroups:
  - maxcloud.gronblom.dev
  resources:
  - buckets/status
  - databasebranches/status
  - databases/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - backups
  - clusters
  - scheduledbackups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
