# The discovery document (/.well-known/maxcloud.json) and the API gateway.
# The cluster's repo routes to them publicly.
apiVersion: v1
kind: Service
metadata:
  name: maxcloud-controller
  labels:
    app.kubernetes.io/name: maxcloud-controller
spec:
  selector:
    app.kubernetes.io/name: maxcloud-controller
  ports:
    - name: discovery
      port: 8082
      targetPort: discovery
    - name: gateway
      port: 8083
      targetPort: gateway
