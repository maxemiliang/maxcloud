# Who the cluster's API server trusts besides its own admin certificate:
# Authelia's ID tokens for the client "kubernetes" (mcloud login).
#
# UKS cluster authentication (UpCloud API, public beta) takes this native
# AuthenticationConfiguration; neither the OpenTofu provider nor upctl can
# set it yet. Apply with scripts/cluster-auth.sh, again after a cluster is
# rebuilt. What these users may do: infrastructure/configs/auth.
apiVersion: apiserver.config.k8s.io/v1
kind: AuthenticationConfiguration
jwt:
  - issuer:
      url: https://auth.lab.gronblom.dev
      audiences:
        - kubernetes
    claimMappings:
      username:
        claim: preferred_username
        prefix: "authelia:"
      groups:
        claim: groups
        prefix: "authelia:"
    userValidationRules:
      - expression: "!user.username.startsWith('system:')"
        message: "reserved username"
