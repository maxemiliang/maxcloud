# Traefik as the cluster's only Gateway API controller, behind the cluster's
# only Service type=LoadBalancer (and so the only UpCloud LB).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 12h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  serviceAccountName: flux-helm # infrastructure/controllers/flux-helm.yaml
  chart:
    spec:
      chart: traefik
      version: "42.1.3"
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    # Chart CRDs (Middleware, IngressRoute, ...) are updated with the chart.
    crds: CreateReplace
    remediation:
      retries: 3
  # Cloudflare's edge ranges (ports.websecure.forwardedHeaders.trustedIPs),
  # kept current by a weekly PR from .github/workflows/cloudflare-ips.yaml.
  # Deep-merged with `values` below.
  #
  # Only for logs and display: X-Forwarded-For from Cloudflare can be trusted
  # to come from Cloudflare, but any Cloudflare customer's traffic comes from
  # the same ranges. Never base access control on it; IP-restricted tools
  # belong on *.lab (DNS-only), where the PROXY protocol address is the client.
  valuesFrom:
    - kind: ConfigMap
      name: traefik-cloudflare-ips
      valuesKey: values.yaml
  values:
    # One Traefik pod on every node. The LB sends traffic to every node, and with
    # externalTrafficPolicy: Local (see service below) a node only serves traffic
    # if it runs a Traefik pod itself.
    deployment:
      kind: DaemonSet
    # Upgrades start the new pod next to the old one on each node before
    # stopping the old one (DaemonSet maxSurge), so a node is never without one.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

    providers:
      # Routing comes from Gateway API objects (Gateway, HTTPRoute).
      kubernetesGateway:
        enabled: true
        # HTTPRoutes in maxcloud-system may name a TraefikService
        # (<ns>_<name>@kubernetescrd): how the maxcloud controller routes a
        # public bucket's hostname to Object Storage, which the Gateway API
        # can't reach (no ExternalName backends). Apps can't put routes there.
        crossProviderNamespaces: [maxcloud-system]
        # Copies the LB hostname from the Service into Gateway .status.addresses,
        # which is where external-dns (5d) reads it from.
        statusAddress:
          service:
            enabled: true
      # Traefik's own CRDs stay on, for Middlewares (redirects, forward-auth SSO)
      # that HTTPRoutes reference through an extensionRef filter.
      kubernetesCRD:
        enabled: true
        # TraefikServices may point at ExternalName Services: the maxcloud
        # controller's public-bucket routes (above). Apps can't make
        # TraefikServices or IngressRoutes (infrastructure/configs/run/rbac.yaml).
        allowExternalNameServices: true
        # Safe naming: CRD objects are <namespace>_<name>, as written. The
        # legacy scheme (namespace-name, every other character run made one
        # "-") let names collide: app run's Middleware demo-authelia and
        # run-demo's authelia were both run-demo-authelia, and so were two
        # apps' public-bucket TraefikServices. The maxcloud controller names
        # its TraefikServices the same way (MAXCLOUD_TRAEFIK_SAFE_NAMING in
        # infrastructure/controllers/maxcloud/config.yaml): flip both together.
        safeNaming: true
      # No Ingress objects in this cluster.
      kubernetesIngress:
        enabled: false
    ingressClass:
      enabled: false
    # GatewayClass + Gateway are defined in infrastructure/configs/gateway, so the
    # HTTPS listener can reference the cert-manager certificate (5c).
    gateway:
      enabled: false
    gatewayClass:
      enabled: false

    accessLog:
      enabled: true
      format: json

    # Every entrypoint first removes the request's Knative-Serving-Namespace
    # and -Revision headers (the Middleware is in extraObjects below). The
    # activator sends a request to whichever app's revision they name, so a
    # client or an app's own route could otherwise reach any app's private
    # service through it. Knative's routes set both again in their backend
    # filters, which run after this. Audit M3,
    # private/docs/research/tenant-cluster-local-isolation.md.
    ports:
      web:
        # Every plain-HTTP request gets a permanent redirect to HTTPS.
        http:
          middlewares: &strip-knative-headers
            - traefik_strip-knative-headers@kubernetescrd
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
        # The UpCloud LB sends a PROXY protocol v2 header first (see the Service
        # annotation below) carrying the real client IP. Only trust it from the
        # LB / node network.
        proxyProtocol:
          trustedIPs: &lb-sources
            - 172.16.10.0/24 # cluster network (LB private side, nodes)
            - 100.64.0.0/10 # UKS load balancer range
      websecure:
        http:
          middlewares: *strip-knative-headers
        proxyProtocol:
          trustedIPs: *lb-sources
        # Traefik 3 gives a client 60s to send a whole request, body
        # included: too short for pushing a large image layer to the
        # registry (registry.gronblom.dev).
        transport:
          respondingTimeouts:
            readTimeout: 15m
      # Plain HTTP with no redirect, for Knative (the run platform): the
      # Gateway traefik/knative-local (cluster-local services) and the public
      # Gateway's `in-cluster` listener (Knative's readiness probes of public
      # services). Only on the ClusterIP Service traefik-knative below, never
      # on the LB.
      knative:
        port: 8081
        exposedPort: 80
        protocol: TCP
        # net-gateway-api probes the port named or appProtocol'd "http".
        appProtocol: http
        http:
          middlewares: *strip-knative-headers
        expose:
          default: false
          knative: true

    service:
      spec:
        type: LoadBalancer
        # The LB only uses nodes that run a Traefik pod (UpCloud's CCM adds an
        # HTTP health check on the Service's healthCheckNodePort). The default,
        # Cluster, lets a node without Traefik forward the connection to the
        # other node, and that hop rewrites the source to a pod-network
        # address Traefik doesn't trust, so the PROXY header (and the
        # client IP) was ignored on about half of all connections.
        externalTrafficPolicy: Local
      # traefik-knative: in-cluster only. Cluster-local Knative services
      # (name.namespace.svc.cluster.local) resolve to it.
      additionalServices:
        knative:
          spec:
            type: ClusterIP
      annotations:
        # Read by UpCloud's cloud-controller-manager. Each frontend/backend name
        # must match a Service port name (the chart names them web / websecure).
        #   plan essentials: free. The CCM default is "development", which is billed.
        #   mode tcp: L4 passthrough, so Traefik terminates TLS with the
        #     cert-manager certificates. The default "http" mode on 443 would
        #     make the LB terminate TLS with its own auto-issued certificate.
        #   outbound_proxy_protocol v2: preserve the client IP through the LB.
        #   health_check_*: probe every 2s, take a node out after 2 failures
        #     (~4-6s) and back in after 2 successes. The CCM default (10s x 3)
        #     kept sending connections to a rebooting node for ~45s. The CCM
        #     still fills in the check itself (HTTP on the healthCheckNodePort).
        service.beta.kubernetes.io/upcloud-load-balancer-config: |
          {
            "name": "homelab-traefik",
            "plan": "essentials",
            "frontends": [
              {"name": "web", "mode": "tcp", "port": 80},
              {"name": "websecure", "mode": "tcp", "port": 443}
            ],
            "backends": [
              {"name": "web", "properties": {
                "outbound_proxy_protocol": "v2",
                "health_check_interval": 2, "health_check_fall": 2, "health_check_rise": 2
              }},
              {"name": "websecure", "properties": {
                "outbound_proxy_protocol": "v2",
                "health_check_interval": 2, "health_check_fall": 2, "health_check_rise": 2
              }}
            ]
          }

    # In the same release as the entrypoints that name it: an entrypoint
    # whose Middleware doesn't exist (yet) fails every router on it.
    extraObjects:
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: strip-knative-headers
          namespace: traefik
        spec:
          headers:
            # An empty value removes the header.
            customRequestHeaders:
              Knative-Serving-Namespace: ""
              Knative-Serving-Revision: ""
