# Knative Operator: installs and upgrades Knative Serving from the
# KnativeServing resource in infrastructure/configs/knative. The operator
# bundles the Serving release of its own version, so bumping this chart
# (Renovate) is how Knative is upgraded. Knative supports upgrading one minor
# version at a time, so merge those PRs in order.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: knative-operator
  namespace: knative-operator
spec:
  interval: 12h
  url: https://knative.github.io/operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: knative-operator
  namespace: knative-operator
spec:
  interval: 1h
  serviceAccountName: flux-helm # infrastructure/controllers/flux-helm.yaml
  chart:
    spec:
      chart: knative-operator
      version: "v1.24.0"
      sourceRef:
        kind: HelmRepository
        name: knative-operator
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The CRDs (KnativeServing, KnativeEventing) are chart templates, so they're
    # upgraded with the chart.
    knative_operator:
      knative_operator:
        # Pod-level settings the restricted Pod Security level needs; the
        # chart only sets container-level ones.
        securityContext: &restricted
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        # Requests sized to measured use; the chart's 100m each don't fit the
        # CPU budget of one node during a drain.
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 512Mi
      operator_webhook:
        securityContext: *restricted
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
