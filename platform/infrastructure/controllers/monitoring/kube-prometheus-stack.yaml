# kube-prometheus-stack: Prometheus Operator, Prometheus, Alertmanager, Grafana,
# kube-state-metrics and node-exporter, plus the upstream kube-prometheus
# dashboards and alert rules.
#
# Prometheus picks up every ServiceMonitor, PodMonitor and PrometheusRule in the
# cluster (the *SelectorNilUsesHelmValues settings below), so other charts can
# ship their own scrape configs and alerts.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 12h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  serviceAccountName: flux-helm # infrastructure/controllers/flux-helm.yaml
  # First install pulls several images and waits for the Prometheus volume.
  timeout: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.16.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    # Helm installs CRDs on first install but never upgrades them. CreateReplace
    # makes Flux replace them on every upgrade, so new chart versions get the
    # matching CRD schemas.
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # UKS runs the control plane for us: the controller manager, scheduler and
    # etcd aren't reachable from the nodes, and Cilium replaces kube-proxy.
    # Without these, their ServiceMonitors would find nothing and their alerts
    # would fire forever.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false
        windows: false

    # UKS labels its CoreDNS pods k8s-app=coredns, not the usual kube-dns.
    coreDns:
      service:
        selector:
          k8s-app: coredns

    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi

    prometheus:
      prometheusSpec:
        # By default Prometheus only selects objects labelled with this Helm
        # release. false = select every ServiceMonitor/PodMonitor/Probe/
        # ScrapeConfig/PrometheusRule in every namespace.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        # Apps write their own ServiceMonitors and PodMonitors, so those may
        # not read files in the Prometheus pod: bearerTokenFile pointed at
        # Prometheus's service account token would send it to the app's pod
        # (it reads every pod spec). None of the charts' monitors use files.
        arbitraryFSAccessThroughSMs:
          deny: true

        # Whichever limit is hit first. retentionSize stays below the volume
        # size, leaving room for the write-ahead log and compaction.
        retention: 15d
        retentionSize: 8GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              # Metrics are disposable: deleting the PVC also deletes the disk.
              storageClassName: upcloud-block-storage-maxiops-encrypted-delete
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 10Gi

        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1536Mi

    alertmanager:
      # Merged into the chart's default config: its inhibit rules and templates
      # stay, route and receivers are replaced.
      config:
        route:
          group_by: [namespace, alertname]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: telegram
          routes:
            # Dead man's switch: Watchdog always fires, so Alertmanager pings
            # healthchecks.io every minute or two. If the pings stop (cluster,
            # Prometheus or Alertmanager down), healthchecks.io alerts on its own.
            - receiver: healthchecks
              matchers:
                - alertname = "Watchdog"
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 1m
            # severity=info (e.g. CPUThrottlingHigh) is for dashboards, not phones.
            # InfoInhibitor is a helper alert that is always firing.
            - receiver: "null"
              matchers:
                - severity =~ "info|none"
        receivers:
          - name: "null"
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-notifiers/telegram-bot-token
                # A Telegram group chat (group IDs are negative). Not a secret:
                # posting needs the bot token.
                chat_id: -5539298451
                # From templateFiles below. The default message is a dump of
                # every label, with the summary buried among scrape labels.
                parse_mode: HTML
                message: '{{ template "telegram.homelab.message" . }}'
          - name: healthchecks
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-notifiers/healthchecks-ping-url
                send_resolved: false
      # Mounted next to alertmanager.yaml and loaded by its templates:
      # /etc/alertmanager/config/*.tmpl. Not run through Helm's tpl, so the
      # {{ }} reach Alertmanager as written. One Telegram message per alert
      # group (parse_mode HTML, so values go through html): summary,
      # description, when it started (Helsinki time), the runbook link if the
      # rule has one, and the remaining labels in a collapsed quote.
      templateFiles:
        telegram.tmpl: |-
          {{ define "telegram.homelab.alert" -}}
          {{ if eq .Status "firing" }}{{ if eq .Labels.severity "critical" }}🔴{{ else }}🟠{{ end }}{{ else }}✅{{ end }} <b>{{ with .Annotations.summary }}{{ . | html }}{{ else }}{{ .Labels.alertname | html }}{{ end }}</b>
          {{ with .Annotations.description }}{{ . | html }}
          {{ end -}}
          {{ if eq .Status "firing" -}}
          <i>Firing since {{ .StartsAt | tz "Europe/Helsinki" | date "Mon 15:04" }} ({{ (since .StartsAt).Seconds | humanizeDuration }} ago)</i>
          {{- else -}}
          <i>Resolved {{ .EndsAt | tz "Europe/Helsinki" | date "Mon 15:04" }}, after {{ (.EndsAt.Sub .StartsAt).Seconds | humanizeDuration }}</i>
          {{- end }}
          {{ with .Annotations.runbook_url }}<a href="{{ . }}">Runbook</a>
          {{ end -}}
          <blockquote expandable>{{ $sep := "" }}{{ range .Labels.SortedPairs }}{{ if not (match "^(alertname|severity|prometheus|endpoint|instance|job|service|uid)$" .Name) }}{{ $sep }}{{ .Name | html }}={{ .Value | html }}{{ $sep = "\n" }}{{ end }}{{ end }}</blockquote>
          {{ end }}

          {{ define "telegram.homelab.message" -}}
          {{ if gt (len .Alerts.Firing) 0 -}}
          <b>FIRING · {{ .CommonLabels.alertname | html }}</b>{{ with .CommonLabels.severity }} ({{ . }}){{ end }}{{ if gt (len .Alerts.Firing) 1 }} ×{{ len .Alerts.Firing }}{{ end }}

          {{ range .Alerts.Firing }}{{ template "telegram.homelab.alert" . }}
          {{ end }}{{ end -}}
          {{ if gt (len .Alerts.Resolved) 0 -}}
          <b>RESOLVED · {{ .CommonLabels.alertname | html }}</b>{{ if gt (len .Alerts.Resolved) 1 }} ×{{ len .Alerts.Resolved }}{{ end }}

          {{ range .Alerts.Resolved }}{{ template "telegram.homelab.alert" . }}
          {{ end }}{{ end -}}
          {{ end }}
      alertmanagerSpec:
        # Mounted at /etc/alertmanager/secrets/<name>/<key>, read by the
        # *_file settings above. From alertmanager-notifiers.sops.yaml.
        secrets:
          - alertmanager-notifiers
        # Keeps silences and notification state across restarts; otherwise a
        # silence set before maintenance is lost when kured reboots the node.
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: upcloud-block-storage-maxiops-encrypted-delete
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    grafana:
      # Grafana always needs a local admin user; its password (from
      # grafana-admin.sops.yaml) can't be used to log in while the password
      # login is disabled below. Break-glass if Authelia is down: set
      # auth.disable_login_form and auth.basic.enabled back to their defaults
      # in git, push, log in as admin.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password

      # No volume: dashboards and datasources are provisioned from ConfigMaps
      # (the sidecar below), so Grafana's own database only holds sessions and
      # preferences, which may be lost on restart.
      persistence:
        enabled: false

      grafana.ini:
        server:
          root_url: https://grafana.lab.gronblom.dev
        # Authelia only: no username/password form, no password auth on the
        # API. Signing out of Grafana also ends the Authelia session, otherwise
        # auto_login would sign you straight back in.
        auth:
          disable_login_form: true
          signout_redirect_url: https://auth.lab.gronblom.dev/logout
        auth.basic:
          enabled: false
        # "Sign in with Authelia" (OIDC). Matches the grafana client in
        # infrastructure/controllers/authelia/configuration.yml; settings from
        # https://www.authelia.com/integration/openid-connect/clients/grafana/
        auth.generic_oauth:
          enabled: true
          name: Authelia
          icon: signin
          # Skip Grafana's login page and go straight to Authelia.
          auto_login: true
          client_id: grafana
          # client_secret: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET, see envValueFrom.
          scopes: openid profile email groups
          empty_scopes: false
          auth_url: https://auth.lab.gronblom.dev/api/oidc/authorization
          token_url: https://auth.lab.gronblom.dev/api/oidc/token
          api_url: https://auth.lab.gronblom.dev/api/oidc/userinfo
          login_attribute_path: preferred_username
          groups_attribute_path: groups
          name_attribute_path: name
          use_pkce: true
          auth_style: InHeader
          # Authelia group admins -> Grafana Admin; anyone else is a Viewer.
          role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
          allow_sign_up: true

      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oidc
            key: client-secret

      # Prometheus is added by the chart; Loki is a separate release (loki.yaml).
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy

      # DNS-only *.lab hostname: external-dns creates the record, Traefik
      # serves the *.lab.gronblom.dev certificate.
      route:
        main:
          enabled: true
          hostnames:
            - grafana.lab.gronblom.dev
          parentRefs:
            - name: public
              namespace: traefik
              sectionName: https-lab

      # Grafana 13 idles at ~330Mi and was OOM-killed at a 384Mi limit while
      # loading dashboards.
      resources:
        requests:
          cpu: 25m
          memory: 384Mi
        limits:
          memory: 1Gi
      # The dashboard and datasource sidecars idle at ~80Mi each.
      sidecar:
        resources:
          requests:
            cpu: 5m
            memory: 96Mi
          limits:
            memory: 192Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          memory: 64Mi
