apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # node-exporter reads the host's /proc and /sys through hostPath mounts and
    # runs in the host's network and PID namespaces, which the baseline and
    # restricted Pod Security levels forbid. Explicit, so it's a visible exception.
    pod-security.kubernetes.io/enforce: privileged
