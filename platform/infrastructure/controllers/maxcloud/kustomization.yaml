# What the maxcloud controller needs from this cluster. The controller itself
# (CRDs, RBAC, Deployment) comes from the maxcloud repo at a release tag:
# clusters/personal/maxcloud.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - config.yaml
  # UPCLOUD_TOKEN (sub-account maxcloud_controller, scoped to the
  # maxcloud-apps instance, usable only from the NAT egress IP),
  # UPCLOUD_TOKEN_EXPIRES_AT, the controller's S3 key, and the apps' secrets
  # backup key (MAXCLOUD_SECRETS_AGE_KEY). To renew the token: README,
  # Procedures, "Renew the maxcloud controller's UpCloud token".
  # The Secret maxcloud-controller holds them, from the private repo:
  # private/secrets/maxcloud-system/controller-credentials.sops.yaml.
  # Reading apps' maxcloud.yaml from Flux: network access and RBAC.
  - app-sync.yaml
  # https://maxcloud.gronblom.dev/.well-known/maxcloud.json, for mcloud login.
  - discovery.yaml
