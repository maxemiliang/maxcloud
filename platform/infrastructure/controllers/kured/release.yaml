# kured (KUbernetes REboot Daemon): when a node has /var/run/reboot-required
# (written by apt after e.g. a kernel update), kured takes a cluster-wide lock,
# cordons and drains the node, reboots it and uncordons it. One node at a time.
#
# Nothing writes the sentinel yet: UKS nodes ship unattended-upgrades switched
# off (APT::Periodic::* "0") until a node group is created with UpCloud's
# Automatic node updates, which the tofu provider doesn't support yet.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kubereboot
  namespace: kured
spec:
  interval: 12h
  url: https://kubereboot.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: kured
spec:
  interval: 1h
  serviceAccountName: flux-helm # infrastructure/controllers/flux-helm.yaml
  chart:
    spec:
      chart: kured
      version: "6.1.0"
      sourceRef:
        kind: HelmRepository
        name: kubereboot
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    configuration:
      # Reboot window, in UTC like UpCloud's node update schedule. When node
      # updates are enabled, schedule them to finish before 01:00 UTC.
      timeZone: UTC
      startTime: "01:00"
      endTime: "04:00"
      # Check for the sentinel every 10 minutes, so both nodes fit in the window.
      period: 10m

      # Give up a drain that hasn't finished in 15 minutes (e.g. blocked by a
      # PodDisruptionBudget) instead of holding the lock forever, and never
      # reboot a node that didn't drain.
      drainTimeout: 15m
      forceReboot: false
      # Release the lock if its holder disappears (e.g. a node that never
      # came back), so the other node isn't blocked forever.
      lockTtl: 1h
      # Record reboot state on the Node object (kubectl describe node).
      annotateNodes: true

      # Reboot by sending SIGRTMIN+5 to the host's systemd (PID 1) instead of
      # running systemctl through nsenter. That needs only the KILL capability,
      # not a privileged container.
      rebootMethod: signal
    containerSecurityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
        add: ["KILL"]

    resources:
      requests:
        cpu: 5m
        memory: 24Mi
      limits:
        memory: 64Mi
