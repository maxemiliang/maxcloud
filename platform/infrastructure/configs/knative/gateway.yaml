# Knative's local gateway: where cluster-local Knative services are routed
# (name.namespace.svc.cluster.local). Knative creates an HTTPRoute on it for
# every service, public or not, and probes it to decide when a new revision
# is ready.
#
# The listener port is Traefik's `knative` entrypoint (8081, see
# infrastructure/controllers/traefik), reachable only through the ClusterIP
# Service traefik-knative, never through the load balancer. Plain HTTP and no
# redirect, unlike the public Gateway's `web` listener.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: knative-local
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8081
      allowedRoutes:
        namespaces:
          from: All
