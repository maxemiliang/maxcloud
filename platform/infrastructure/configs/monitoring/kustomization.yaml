apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - servicemonitors.yaml
  - rules.yaml
  - knative.yaml
  - keda.yaml
  - maxcloud.yaml
configMapGenerator:
  # Grafana's dashboard sidecar loads every ConfigMap labelled
  # grafana_dashboard=1, from any namespace.
  - name: dashboard-run-platform
    namespace: monitoring
    files:
      - dashboards/run-platform.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
