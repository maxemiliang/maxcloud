# Authelia's admins group runs the cluster: kubectl and mcloud logged in
# with `mcloud login` act as cluster-admin. Break-glass (Authelia or the
# cluster down) is the UpCloud API token and `upctl kubernetes config`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authelia-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: authelia:admins
