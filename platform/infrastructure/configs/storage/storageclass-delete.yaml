# Same disks as the UKS default class (upcloud-block-storage-maxiops-encrypted:
# MaxIOPS, encrypted at rest), but the UpCloud disk is deleted together with
# its PVC. reclaimPolicy is immutable on a StorageClass, hence a second class.
#
# Only for disposable volumes: restore drills, test clusters, caches.
# Anything with data worth keeping stays on the default (Retain) class, so a
# mistaken prune (e.g. an app directory removed from git) leaves the disk behind.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: upcloud-block-storage-maxiops-encrypted-delete
provisioner: storage.csi.upcloud.com
parameters:
  tier: maxiops
  encryption: data-at-rest
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
