# The Job that applies config/ to OpenBao (configure.sh). Its ConfigMap's
# name carries a hash of the files (kustomization.yaml), so a change gives
# the Job a new spec, and `force` lets Flux replace the old Job (a Job's pod
# template can't be updated in place). No ttlSecondsAfterFinished: a Job
# that disappeared would just be created again on the next reconcile.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-config
  namespace: openbao
---
# Break-glass admin login (config/configure.sh, scripts/bao.sh
# --break-glass). Nothing runs as it; a token comes only from
# `kubectl create token`, which only cluster admins may do here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-admin
  namespace: openbao
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-config
  namespace: openbao
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-config
    spec:
      serviceAccountName: openbao-config
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: quay.io/openbao/openbao:2.7.3
          command: [/bin/sh, /config/configure.sh]
          env:
            - name: BAO_CACERT
              value: /ca/ca.crt
            - name: HOME
              value: /tmp
            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: openbao-config-env
                  key: OIDC_ISSUER
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: ca
              mountPath: /ca
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: openbao-config
        - name: ca
          configMap:
            name: openbao-ca # trust-manager (pki.yaml)
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
