# What the pods in sandbox-spike may connect to: the two public resolvers,
# and only for the names below, and those names on 443. Everything else is
# dropped, the rest of the cluster included.
# Not part of any Flux Kustomization: applied by hand, see ../sandbox-spike.md.
#
# Why it matters: a session carries the subscription token in its
# environment (CLAUDE_CODE_OAUTH_TOKEN), and runs whatever a prompt or a
# file talks it into. With this, there is nowhere to send the token but the
# hosts listed.
#
# What it doesn't do:
# - It allows addresses, not names: once a name resolves, any TLS
#   connection to that address on 443 passes, whatever host it asks for.
#   registry.npmjs.org is behind Cloudflare, so other sites on the same
#   addresses are reachable by someone who tries.
# - Anything sent to an allowed host is allowed: a package published to
#   npm, a request to the Claude API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sandbox-egress
  namespace: sandbox-spike
spec:
  description: "Sandbox pods: DNS for, and HTTPS to, the Claude API and the npm registry only"
  # Every pod in the namespace. Having an egress section puts them in
  # egress default-deny; ingress isn't touched.
  endpointSelector: {}
  egress:
    # DNS, to the resolvers test.yaml gives the pods (ClusterIPs, CoreDNS's
    # included, don't work under gVisor: docs/kb/networking/gvisor-no-clusterip.md).
    # The dns rules send these packets through Cilium's DNS proxy, which
    # refuses every other name (so DNS can't carry data out either) and
    # learns the addresses the toFQDNs rule below then allows.
    - toCIDR:
        - 1.1.1.1/32
        - 9.9.9.9/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: api.anthropic.com
              - matchName: registry.npmjs.org
    # api.anthropic.com: model requests. A `claude setup-token` token needs
    # no other Anthropic host (no sign-in, no refresh).
    # registry.npmjs.org: installing Claude Code and packages. A real
    # sandbox image has Claude Code in it, and may not need this at all.
    - toFQDNs:
        - matchName: api.anthropic.com
        - matchName: registry.npmjs.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
