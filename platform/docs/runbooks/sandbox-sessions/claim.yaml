# One agent session: a pod made from the claude-code template
# (sandbox/sessions/claude-code.yaml). See ../sandbox-sessions.md.
#   kubectl create -f docs/runbooks/sandbox-sessions/claim.yaml
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  # `kubectl create` adds a suffix. The session's pod gets the claim's name.
  generateName: session-
  namespace: sandbox
spec:
  warmPoolRef:
    name: claude-code
