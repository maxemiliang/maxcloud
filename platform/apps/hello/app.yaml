# traefik/whoami: a tiny server that echoes the request back (client IP,
# headers, TLS). Handy for checking what actually reaches a pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: hello
spec:
  # Two replicas on different nodes, so a node drain (kured) never takes the
  # app down. Also the template for any app that should stay up.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # Hard rule: never both replicas on one node while both nodes are up...
          whenUnsatisfiable: DoNotSchedule
          # ...but a cordoned node (tainted unschedulable during a drain) doesn't
          # count, so the evicted replica can move to the other node.
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hello
          # Count only pods of the same rollout (ReplicaSet). Without this, the
          # old ReplicaSet's pods count too while a rollout is in progress, and
          # both new replicas can end up on the same node.
          matchLabelKeys:
            - pod-template-hash
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          # Unprivileged port: a non-root process can't bind to 80.
          args: ["--port=8080", "--name=hello"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
---
# Lets a drain evict one replica at a time: the second eviction waits until
# the first replica is running again elsewhere.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hello
  namespace: hello
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: hello
spec:
  selector:
    app.kubernetes.io/name: hello
  ports:
    - name: http
      port: 80
      targetPort: http
