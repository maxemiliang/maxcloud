# A private (cluster-local) Knative service in the browser, behind Authelia:
# https://run-demo.lab.gronblom.dev -> Authelia forward auth -> whoami.
#
# Knative's own HTTPRoutes can't carry filters, so this is a route of our own
# on the *.lab.gronblom.dev listener. It sends the request, with the Host
# rewritten to the service's cluster-local name, to Traefik's in-cluster
# entrypoint, which routes it like any cluster-local request. Authelia's
# `*.lab.gronblom.dev` rule (admins, two-factor) decides who gets in. The
# registry (apps/maxcloud) grants this namespace that backend, and
# infrastructure/configs/run/domains.yaml the hostname: like every name
# under lab.gronblom.dev, it sees admins' Authelia sessions.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
  namespace: run-demo
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local/api/authz/forward-auth
    trustForwardHeader: true
    # Passed on to the app: who is logged in.
    authResponseHeaders: [Remote-User, Remote-Groups, Remote-Email, Remote-Name]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-sso
  namespace: run-demo
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https-lab
  hostnames:
    - run-demo.lab.gronblom.dev
  rules:
    - filters:
        # Auth first: Authelia must see the original host.
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authelia
        - type: URLRewrite
          urlRewrite:
            hostname: whoami.run-demo.svc.cluster.local
      backendRefs:
        - name: traefik-knative
          namespace: traefik
          port: 80
