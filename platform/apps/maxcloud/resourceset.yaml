# The maxcloud app registry: everything an app on the run platform gets,
# generated by the Flux Operator once per registry entry (one
# ResourceSetInputProvider per app in flux-system, selected by label).
# mcloud makes the entries in the cluster from each app's maxcloud.yaml; the
# maxcloud controller keeps a copy in Object Storage for a rebuild. The
# platform's own apps are in ./apps/.
#
# Per app:
#   - its namespace, with Pod Security `restricted` and the run platform's
#     admission rules (infrastructure/configs/run)
#   - guardrails: default container resources, a quota, network policies
#   - a reconciler ServiceAccount, `admin` in that namespace only
#   - its owners (the entry's `owners`): `admin` in that namespace, and
#     restoring its database. Nobody else but admins.
#   - a ReferenceGrant for SSO routes to Traefik's in-cluster entrypoint
#   - a GitRepository for the app's repo and a Flux Kustomization that applies
#     its manifests (deploy/k8s by default) into the namespace
#
# An entry's fields (spec.defaultValues):
#   name     namespace and app name (required); public hostnames are
#            <service>--<name>.gronblom.dev
#   repo     <owner>/<repo> on GitHub; leave out for an app kept in this repo
#   path     manifests directory in the repo (default deploy/k8s)
#   branch   (default main)
#   cpu, memory, pods   quota: CPU and memory requested, pod count
#                       (defaults 200m, 1Gi, 20)
#   deploy   gitops (default): Flux applies the app's manifests from git;
#            direct: `mcloud deploy` applies them itself, nothing from git
#   buckets  S3 buckets, comma-separated; `:public` makes one readable by
#            anyone: "uploads,assets:public". Each becomes a Bucket that the
#            maxcloud controller turns into mc-<name>--<bucket> in the
#            maxcloud-apps Object Storage, with the app's credentials in
#            the Secret maxcloud-s3. Dropping a bucket from the list keeps
#            it and its objects in Object Storage (still billed).
#   db       "true": a Postgres database (a Database the maxcloud controller
#            turns into a CloudNativePG Cluster db, DATABASE_URL in db-app),
#            backed up to mc-<name>--db and restored from there by itself.
#            dbInstances (1, or 2 for a replica) and dbSize (default 1Gi).
#            Removing db deletes the database but keeps its backups.
#   domains  custom hostnames for the app's Knative services, comma-separated
#            <host>:<service>, optionally :proxied (behind Cloudflare):
#            "paja.lankkupelit.fi:web:proxied". Each becomes a Domain that the
#            maxcloud controller turns into an HTTPRoute on the public Gateway
#            (external-dns makes the record). Only hostnames an admin allowed
#            the app (infrastructure/configs/run/domains.yaml); admission
#            refuses others.
#   owners   Authelia usernames, comma-separated: "alice,bob". Each is
#            admin in the app's namespace (its Secrets and database
#            included), and only they and admins may change or remove the
#            entry (infrastructure/configs/run/registry-admission.yaml).
#            mcloud makes whoever registers the app an owner; mcloud apps
#            owners changes them. Never synced from the app's maxcloud.yaml.
#            None (run-demo): an admin's app, no developer bindings.
#
# An entry's annotation maxcloud.gronblom.dev/registration is its
# registration ID: the maxcloud controller gives mcloud's entries one, and
# only the registration an app's buckets and database backups belong to
# gets them (a new entry under a deleted app's name doesn't). An entry kept
# in this repo declares its own, as run-demo does (apps/run-demo.yaml).
#
# Removing an entry deletes everything generated for it, including the
# namespace and so the app's data (garbage collection). Its buckets and
# database backups stay in Object Storage, for that registration only.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: maxcloud-apps
  namespace: flux-system
  annotations:
    # Re-apply every 10 minutes, so anything deleted by hand comes back.
    fluxcd.controlplane.io/reconcileEvery: "10m"
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      selector:
        matchLabels:
          run.gronblom.dev/app: "true"
  # No `wait`: one app failing to deploy shows up on its own Kustomization
  # (FluxResourceNotReady) without marking the registry or the other apps
  # not ready.
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: maxcloud
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.name >>
        labels:
          pod-security.kubernetes.io/enforce: restricted
          run.gronblom.dev/tenant: "true"

    # Defaults for containers that don't set resources themselves (Knative
    # services get theirs from Knative's config-defaults first). No CPU
    # limit: throttling hurts more than it protects on mostly idle nodes, and
    # the quota caps the requests.
    - apiVersion: v1
      kind: LimitRange
      metadata:
        name: defaults
        namespace: << inputs.name >>
      spec:
        limits:
          - type: Container
            defaultRequest:
              cpu: 10m
              memory: 64Mi
            default:
              memory: 256Mi
            max:
              memory: 2Gi

    # What one app may reserve. App pods run at the low `tenant` priority, so
    # if the platform needs the room during a drain they're the ones left
    # Pending; the quota stops one app from taking everything the other
    # apps could use.
    - apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: tenant
        namespace: << inputs.name >>
      spec:
        hard:
          requests.cpu: << get inputs "cpu" | default "200m" | quote >>
          requests.memory: << get inputs "memory" | default "1Gi" | quote >>
          limits.memory: "4Gi"
          pods: << get inputs "pods" | default "20" | quote >>
          persistentvolumeclaims: "4"
          requests.storage: 10Gi
          # No LoadBalancer or NodePort Services: apps are reached through
          # the Gateway only, and a LoadBalancer would be a billed UpCloud LB.
          services.loadbalancers: "0"
          services.nodeports: "0"

    # Ingress into the app's pods only from the app itself and the platform.
    # Egress is limited cluster-wide instead: no platform pods
    # (infrastructure/configs/run/tenant-egress.yaml). Other apps'
    # cluster-local services are still reachable through Traefik's
    # in-cluster entrypoint until the per-app policy below is tightened:
    # "private" means not on the internet, not yet invisible to other apps.
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny-ingress
        namespace: << inputs.name >>
      spec:
        podSelector: {}
        policyTypes: [Ingress]
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-same-namespace
        namespace: << inputs.name >>
      spec:
        podSelector: {}
        ingress:
          - from:
              - podSelector: {}
    # traefik: requests routed straight to a revision's pods.
    # knative-serving: the activator (requests while scaling from zero) and
    #   the autoscaler (scrapes the queue-proxy sidecars).
    # monitoring: Prometheus scraping app metrics.
    # cnpg-system: the CloudNativePG operator talking to database pods.
    # keda: KEDA's operator running queue-length queries against the app's
    #   database.
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-from-platform
        namespace: << inputs.name >>
      spec:
        podSelector: {}
        ingress:
          - from:
              - namespaceSelector:
                  matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values: [traefik, knative-serving, monitoring, cnpg-system, keda]

    # The app's manifests are applied as this ServiceAccount: the built-in
    # `admin` role in its namespace (plus infrastructure/configs/run/rbac.yaml
    # and what Knative and KEDA aggregate into it), nothing elsewhere. `admin`
    # can't change the quota or limits above. It lives in flux-system because
    # a Kustomization can only impersonate one in its own namespace.
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: << inputs.name >>-reconciler
        namespace: flux-system
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: << inputs.name >>-reconciler
        namespace: << inputs.name >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
        - kind: ServiceAccount
          name: << inputs.name >>-reconciler
          namespace: flux-system

    # Lets the app's HTTPRoutes send requests to Traefik's in-cluster
    # entrypoint: how a private service is put behind the Authelia login
    # (templates/run-app/deploy/examples/sso.yaml). Harmless if unused.
    - apiVersion: gateway.networking.k8s.io/v1beta1
      kind: ReferenceGrant
      metadata:
        name: << inputs.name >>
        namespace: traefik
      spec:
        from:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
            namespace: << inputs.name >>
        to:
          - group: ""
            kind: Service
            name: traefik-knative

    # Which hostnames this app's pods may ask Traefik's in-cluster
    # entrypoint (8081) for: its own cluster-local names. The rest of the
    # policy is infrastructure/configs/run/traefik-ingress.yaml; this one
    # repeats its rules for everything else, so that this policy on its own
    # can't drop any other traffic to Traefik. Audit M3.
    # TIGHTENED (2026-11-12): only the app's own names below; public Knative
    # names come from the base policy. Procedure:
    # private/docs/kb/networking/traefik-ingress-host-rules.md.
    - apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: app-<< inputs.name >>
        namespace: traefik
      spec:
        description: "Traefik: which hostnames app << inputs.name >> may ask the in-cluster entrypoint for"
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
        ingress:
          # Same as traefik-ingress.yaml: every port but 8081 from anything,
          # ICMP, and 8081 from pods that aren't apps.
          - fromEntities: [all]
            toPorts:
              - ports:
                  - port: "1"
                    endPort: 8080
                    protocol: ANY
                  - port: "8082"
                    endPort: 65535
                    protocol: ANY
          - fromEntities: [all]
            icmps:
              - fields:
                  - {type: 3, family: IPv4}
                  - {type: 11, family: IPv4}
                  - {type: 8, family: IPv4}
          - fromEndpoints:
              - matchExpressions:
                  - key: k8s:io.kubernetes.pod.namespace
                    operator: Exists
                  - key: k8s:io.cilium.k8s.namespace.labels.run.gronblom.dev/tenant
                    operator: DoesNotExist
            toPorts:
              - ports:
                  - port: "8081"
                    protocol: TCP
          # 8081 from this app's pods.
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: << inputs.name >>
            toPorts:
              - ports:
                  - port: "8081"
                    protocol: TCP
                rules:
                  http:
                    # The app's own names, full-string RE2 on the
                    # :authority (single-quoted YAML, so \. stays one
                    # backslash): <svc>.<app>, <svc>.<app>.svc,
                    # <svc>.<app>.svc.cluster.local, with an optional port.
                    # Case tricks and trailing dots fail closed.
                    - host: '[a-z0-9]+(-+[a-z0-9]+)*\.<< inputs.name >>(\.svc(\.cluster\.local)?)?(:[0-9]+)?'

    # The app's own repo; only fetches the manifests directory. Not generated
    # for an app kept in this repo, which uses the flux-system source, nor for
    # a direct-deploy app.
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      metadata:
        name: << inputs.name >>
        namespace: flux-system
        annotations:
          fluxcd.controlplane.io/reconcile: << if and (get inputs "repo") (ne (get inputs "deploy" | default "gitops") "direct") >>enabled<< else >>disabled<< end >>
          # Where Flux's GitHub App (maxcloud-deployment) gets access to more
          # repos: mcloud deploy opens it when Flux can't read this one.
          maxcloud.gronblom.dev/github-app-access: https://github.com/apps/maxcloud-deployment/installations/new
      spec:
        interval: 1m
        # Inputs are quoted, and checked for newlines and the like
        # (infrastructure/configs/run/registry-admission.yaml): they mustn't
        # add keys to these objects.
        url: << printf "https://github.com/%s.git" (get inputs "repo") | quote >>
        ref:
          branch: << get inputs "branch" | default "main" | quote >>
        # Flux's GitHub App; it needs access to the repo too.
        provider: github
        secretRef:
          name: flux-system
        # The manifests, and maxcloud.yaml: the maxcloud controller reads it
        # from this artifact and updates the app's entry (quota, buckets,
        # database, domains) on push.
        ignore: |
          /*
          !/<< get inputs "path" | default "deploy/k8s" | trimPrefix "./" >>/
          !/maxcloud.yaml

    # Flux applying the app's manifests. Not generated for a direct-deploy
    # app, which mcloud applies itself.
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: << inputs.name >>
        namespace: flux-system
        annotations:
          fluxcd.controlplane.io/reconcile: << if eq (get inputs "deploy" | default "gitops") "direct" >>disabled<< else >>enabled<< end >>
      spec:
        interval: 1h
        retryInterval: 2m
        timeout: 5m
        sourceRef:
          kind: GitRepository
          name: << if get inputs "repo" >><< inputs.name >><< else >>flux-system<< end >>
        path: << printf "./%s" (get inputs "path" | default "deploy/k8s" | trimPrefix "./") | quote >>
        # Everything lands in the app's namespace, whatever the manifests say.
        targetNamespace: << inputs.name >>
        serviceAccountName: << inputs.name >>-reconciler
        prune: true
        wait: true
        # No SOPS decryption: sops-age is the platform's own key, and
        # kustomize-controller decrypts a secretGenerator's files whole, so
        # an app repo holding a copy of any *.sops.yaml from this repo would
        # get its plaintext as a Secret in the app's namespace. Apps keep
        # secrets in the cluster instead (mcloud secrets, app-secrets).

  # One Bucket per entry in `buckets` (a loop needs a template, not a list
  # of objects), the Database if `db` is on, one Domain per entry in
  # `domains`, and the owners' RoleBindings. The maxcloud controller does
  # the rest.
  resourcesTemplate: |
    << range $entry := splitList "," (get inputs "buckets" | default "") >>
    << $parts := splitList ":" (trim $entry) >>
    << if index $parts 0 >>
    ---
    apiVersion: maxcloud.gronblom.dev/v1alpha1
    kind: Bucket
    metadata:
      name: << index $parts 0 >>
      namespace: << inputs.name >>
    spec:
      public: << has "public" (rest $parts) >>
    << end >>
    << end >>
    << if eq (get inputs "db" | default "") "true" >>
    ---
    apiVersion: maxcloud.gronblom.dev/v1alpha1
    kind: Database
    metadata:
      name: db
      namespace: << inputs.name >>
    spec:
      instances: << get inputs "dbInstances" | default "1" >>
      size: << get inputs "dbSize" | default "1Gi" | quote >>
    << end >>
    << range $entry := splitList "," (get inputs "domains" | default "") >>
    << $parts := splitList ":" (trim $entry) >>
    << if index $parts 0 >>
    ---
    apiVersion: maxcloud.gronblom.dev/v1alpha1
    kind: Domain
    metadata:
      name: << index $parts 0 >>
      namespace: << inputs.name >>
    spec:
      service: << index $parts 1 >>
      proxied: << has "proxied" (rest (rest $parts)) >>
    << end >>
    << end >>
    << $owners := list >>
    << range $o := splitList "," (get inputs "owners" | default "") >>
    << if trim $o >><< $owners = append $owners (trim $o) >><< end >>
    << end >>
    << if $owners >>
    ---
    # The app's owners (mcloud login, Authelia users) run it: admin in its
    # namespace, and restoring its database. Admins have cluster-admin
    # anyway (infrastructure/configs/auth); other developers only read
    # (maxcloud-developer-read).
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: app-owners
      namespace: << inputs.name >>
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: admin
    subjects:
    << range $o := $owners >>
      - apiGroup: rbac.authorization.k8s.io
        kind: User
        name: << printf "authelia:%s" $o | quote >>
    << end >>
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: app-owners-db
      namespace: << inputs.name >>
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: maxcloud-app-developer
    subjects:
    << range $o := $owners >>
      - apiGroup: rbac.authorization.k8s.io
        kind: User
        name: << printf "authelia:%s" $o | quote >>
    << end >>
    << end >>
