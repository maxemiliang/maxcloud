# Tool versions for this repo. `mise install` in the repo root installs them;
# mise puts them on PATH whenever you're inside this directory.
# Renovate keeps them current (renovate.json); kubectl minor bumps need approval.

[tools]
opentofu = "1.13.2"
# kubectl must stay within one minor version of the cluster.
# UKS offers up to 1.36 (`upctl kubernetes versions`, 2026-10-28).
kubectl = "1.36.5"
flux2 = "2.10.0"
helm = "4.3.1"
kustomize = "5.8.3"
sops = "3.13.3"
age = "1.3.2"
upctl = "3.37.0"
kubeconform = "0.8.0"
yq = "latest"

[env]
# kubectl/helm/flux in this repo always target the homelab cluster.
# The file itself lives outside the repo (written by `upctl kubernetes config`).
KUBECONFIG = "{{env.HOME}}/.kube/homelab.yaml"
# Secrets live in a gitignored .env (see .env.example). `.env` may not exist
# yet, so don't fail if it's missing.
_.file = { path = ".env", redact = true }
