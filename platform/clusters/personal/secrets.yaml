# The platform's Secrets, made by External Secrets Operator from OpenBao
# (platform/secrets: one ExternalSecret per Secret). Until 2026-11 these
# were SOPS files in the private repo (docs/runbooks/openbao.md, section 1).
#
# No dependsOn on infra-controllers, on purpose: the Secrets' namespaces
# come from infra-controllers, whose pods need these Secrets to become
# ready, so neither may wait for the other. On a fresh cluster the first
# apply fails (namespace or ESO CRDs not found) until infra-controllers has
# made them; retryInterval brings it back. It does wait for OpenBao
# (secrets-store), which needs nothing from here.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  dependsOn:
    - name: secrets-store
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/secrets
  prune: true
  # Ready once every ExternalSecret has synced.
  wait: true
