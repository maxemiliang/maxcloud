# The platform's Secrets, SOPS-encrypted, from the private repo
# (maxemiliang/homelab, its secrets/ directory). This repo is public, so
# they never live here. Locally the private repo is the optional submodule
# private/ at the repo root; Flux doesn't use the submodule (or its pinned
# commit): it reads the private repo's main.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: private
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/maxemiliang/homelab.git
  ref:
    branch: main
  # The Flux GitHub App: source-controller exchanges its private key for a
  # short-lived installation token on each fetch. The Secret flux-system is
  # made by infra/flux and never committed.
  provider: github
  secretRef:
    name: flux-system
  # Only the Secrets; the write-ups in docs/ are not Flux's business.
  ignore: |
    /*
    !/secrets/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  # No dependsOn, on purpose. The Secrets' namespaces come from
  # infra-controllers, whose pods need these Secrets to become ready, so
  # neither may wait for the other. On a fresh cluster the first apply fails
  # (namespace not found) until infra-controllers has made the namespaces;
  # retryInterval brings it back, well inside infra-controllers' 10m timeout.
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: private
  path: ./secrets
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
