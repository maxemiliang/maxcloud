# OpenBao (platform/secrets-store): the store every platform and app Secret
# comes from, through External Secrets Operator.
#
# No dependsOn, like `secrets`: it needs CRDs and controllers from
# infra-controllers (cert-manager, CloudNativePG and its backup plugin,
# trust-manager), while infra-controllers' own pods need the Secrets that
# come from OpenBao. The first applies fail until those CRDs exist, and
# retryInterval brings it back. Nothing here needs a secret from OpenBao:
# its only Secrets, openbao-seal and openbao-backup-s3, come from infra/flux.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-store
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/secrets-store
  prune: true
  # Ready once OpenBao is unsealed and the config Job has finished.
  wait: true
