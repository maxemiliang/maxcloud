apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-instance.yaml
  - flux-operator.yaml
configMapGenerator:
  - name: flux-operator-values
    namespace: flux-system
    files:
      - values.yaml=flux-operator-values.yaml
generatorOptions:
  # A stable name, so the HelmRelease's valuesFrom can reference it.
  disableNameSuffixHash: true
  labels:
    # Tells helm-controller to reconcile the HelmRelease as soon as the values change.
    reconcile.fluxcd.io/watch: Enabled
