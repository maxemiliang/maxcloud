# Entry point for Flux (FluxInstance .spec.sync.path). Everything the cluster
# runs is reachable from here:
#   flux-system -> infra-controllers -> infra-configs -> apps
#                                    -> maxcloud-controller
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - infrastructure.yaml
  - apps.yaml
  - maxcloud.yaml
