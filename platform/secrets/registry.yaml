# Secrets for registry, from OpenBao at platform/registry/<name>.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: registry
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: registry
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      path: platform
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: reader
          serviceAccountRef:
            name: eso-reader
---
# zot's S3 key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-s3
  namespace: registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: zot-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: registry/zot-s3
