# Secrets for authelia, from OpenBao at platform/authelia/<name>.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: authelia
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: authelia
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      path: platform
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: reader
          serviceAccountRef:
            name: eso-reader
---
# Authelia's own keys and the Grafana client's digest (scripts/authelia-secrets.sh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-secrets
  namespace: authelia
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: authelia-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: authelia/authelia-secrets
---
# users_database.yml (scripts/developer.sh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users
  namespace: authelia
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: authelia-users
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: authelia/authelia-users
