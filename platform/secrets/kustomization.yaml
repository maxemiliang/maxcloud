# The platform's Secrets, from OpenBao (Flux Kustomization `secrets`,
# clusters/personal/secrets.yaml). Each namespace gets a ServiceAccount
# eso-reader and a SecretStore openbao, which OpenBao lets read only
# platform/<namespace>/ (secrets-store/config/ns-reader.hcl), and an
# ExternalSecret per Secret, under the Secret's own name.
#
# A new platform secret: `scripts/bao.sh kv put -mount=platform
# <namespace>/<name> KEY=-` (the value from stdin), then an ExternalSecret
# here. deletionPolicy Retain: if OpenBao loses the path, the Secret keeps
# its last values rather than vanishing under a running controller.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - authelia.yaml
  - cert-manager.yaml
  - claude-history.yaml
  - external-dns.yaml
  - maxcloud-system.yaml
  - monitoring.yaml
  - registry.yaml
