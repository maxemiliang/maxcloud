# Secrets for maxcloud-system, from OpenBao at platform/maxcloud-system/<name>.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: maxcloud-system
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: maxcloud-system
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      path: platform
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: reader
          serviceAccountRef:
            name: eso-reader
---
# UpCloud token, S3 key (README, Procedures).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maxcloud-controller
  namespace: maxcloud-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: maxcloud-controller
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: maxcloud-system/maxcloud-controller
