# Secrets for monitoring, from OpenBao at platform/monitoring/<name>.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: monitoring
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      path: platform
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: reader
          serviceAccountRef:
            name: eso-reader
---
# Telegram and the healthchecks.io dead man's switch.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-notifiers
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: alertmanager-notifiers
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: monitoring/alertmanager-notifiers
---
# Grafana's local admin.
apiVersion: external-secrets.io/v1
