# Secrets for claude-history, from OpenBao at platform/claude-history/<name>.
# Written by scripts/claude-history-secrets.sh.
#
# platform/claude-history/laptop (the ingest password and the S3 writer
# key for the laptops' Vector) has no ExternalSecret on purpose: it never
# becomes a Secret in the cluster. Laptops read it with scripts/bao.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: claude-history
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: claude-history
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      path: platform
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: reader
          serviceAccountRef:
            name: eso-reader
---
# The ingest user's password hash (CLICKHOUSE_INGEST_PASSWORD_SHA256),
# which is all ClickHouse gets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-users
  namespace: claude-history
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: clickhouse-users
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: claude-history/clickhouse-users
