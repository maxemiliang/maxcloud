# ClickHouse with Claude Code's transcripts, sent by Vector from the
# laptops (dotfiles: claude-history/). One replica and one volume; the
# claude-history bucket has every line too (Vector writes it there as
# well), which is the backup: docs/runbooks/claude-history-restore.md.
#
# Access (users.xml has the details):
# - ingest: Vector, from the internet, through the HTTPRoute below. It may
#   only insert into claude.events.
# - default: the admin, from the pod's localhost only, so through `kubectl
#   exec` or `kubectl port-forward` (README, "Claude Code history").
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # The image's clickhouse user.
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          # 26.8 is an LTS release; Renovate stays on 26.8.x (renovate.json).
          image: clickhouse/clickhouse-server:26.8.43
          env:
            # Users come from users.xml only: the entrypoint leaves them.
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: "1"
            # schema.sql on every start, not only on an empty volume. It
            # runs before the server listens on anything but localhost.
            - name: CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS
              value: "1"
          envFrom:
            # CLICKHOUSE_INGEST_PASSWORD_SHA256.
            - secretRef:
                name: clickhouse-users
          ports:
            - name: http
              containerPort: 8123
            - name: metrics
              containerPort: 9363
          # The entrypoint first runs schema.sql on a server bound to
          # 127.0.0.1, then starts the real one.
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Idles at ~200 MiB. server.xml caps ClickHouse at 1.2 GiB, under
          # the limit. Measured backfilling 400 MB of transcripts: ~190 MiB
          # tracked by ClickHouse, the rest page cache.
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/clickhouse-server/config.d/claude-history.xml
              subPath: server.xml
              readOnly: true
            - name: config
              mountPath: /etc/clickhouse-server/users.d/claude-history.xml
              subPath: users.xml
              readOnly: true
            - name: config
              mountPath: /docker-entrypoint-initdb.d/schema.sql
              subPath: schema.sql
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # UKS's default class: MaxIOPS, encrypted, Retain (data worth
        # keeping: docs/kb/data/block-storage-tiers.md). About 140 MB per
        # month of transcripts.
        storageClassName: upcloud-block-storage-maxiops-encrypted
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: metrics
      port: 9363
      targetPort: metrics
