# ClickHouse's own metrics (server.xml, <prometheus>): memory, merges,
# inserted rows, failed logins.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clickhouse
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  endpoints:
    - port: metrics
      interval: 60s
