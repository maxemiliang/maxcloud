# agent-sandbox (kubernetes-sigs): the controller behind the Sandbox,
# SandboxTemplate, SandboxWarmPool and SandboxClaim kinds. A SandboxClaim
# becomes one pod with a stable name that can be suspended, resumed and
# given an expiry; sandbox/sessions has the template the claims use.
#
# The chart isn't published anywhere: it's the helm/ directory of the repo,
# so the source is the repo at a release tag. The GitRepository is in this
# namespace because Flux (multitenant mode) refuses a source in another one.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: agent-sandbox
  namespace: agent-sandbox-system
spec:
  interval: 24h
  url: https://github.com/kubernetes-sigs/agent-sandbox
  ref:
    tag: v1.0.10
  # Only the chart, not the whole repo.
  ignore: |
    /*
    !/helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-sandbox
  namespace: agent-sandbox-system
spec:
  interval: 1h
  serviceAccountName: flux-helm # ./flux-helm.yaml
  chart:
    spec:
      chart: ./helm
      sourceRef:
        kind: GitRepository
        name: agent-sandbox
      # The default reconcileStrategy (ChartVersion) on purpose: a new tag
      # gives a new chart only when helm/Chart.yaml's version changed, which
      # upstream does whenever the CRDs or the RBAC rules change. With
      # Revision the version becomes 0.1.4+<commit>, the chart puts it in a
      # label, and every object is refused ("a valid label must be ...").
  install:
    # The chart keeps its CRDs in crds/, which Helm installs once and never
    # upgrades. Flux does both.
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    namespace:
      create: false # ./namespace.yaml
      name: agent-sandbox-system
    image:
      # The chart has no default: the controller's version is the tag's.
      # renovate: datasource=github-tags depName=kubernetes-sigs/agent-sandbox
      tag: v1.0.10
    controller:
      # SandboxTemplate, SandboxWarmPool and SandboxClaim.
      extensions: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
