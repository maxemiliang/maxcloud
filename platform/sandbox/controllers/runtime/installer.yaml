# gVisor on the sandbox node group: a privileged DaemonSet that installs
# runsc on each sandbox node and registers it with containerd (install.sh).
# UKS has no hook for node setup, so this is the only way to get a runtime
# onto a node, and UpCloud doesn't support it. What it found and how it
# behaves: docs/kb/ops/sandbox-gvisor-on-uks.md.
#
# A new or replaced sandbox node has no runsc until this pod has run on it
# (about 15 seconds). A session pod scheduled before that waits and starts by
# itself.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gvisor-installer
  namespace: sandbox-system
spec:
  selector:
    matchLabels:
      app: gvisor-installer
  template:
    metadata:
      labels:
        app: gvisor-installer
    spec:
      # Sandbox nodes only (the node group's label, infra/cluster/nodes.tf).
      nodeSelector:
        pool: sandbox
      tolerations:
        - operator: Exists
      # nsenter into the node's namespaces, for systemctl and containerd.
      hostPID: true
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      containers:
        - name: installer
          image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          command: ["/bin/sh", "/scripts/install.sh"]
          env:
            # A dated release from https://github.com/google/gvisor/tags
            # (release-20261102.0), and the content of
            # https://storage.googleapis.com/gvisor/releases/release/<date>/x86_64/gvisor.tar.bz2.sha512
            # Renovate doesn't know these: bump both by hand.
            - name: GVISOR_RELEASE
              value: "20261102"
            - name: GVISOR_SHA512
              value: 2e6671bb2d033b871c5811ab57e16ac570988b0e0054c525f911cfaf191bab3ca4efb08e0a98daa4b9e7d248f9e5776ef2ef2f8a6b82d829646a42924c98bb05
          securityContext:
            privileged: true
          # Ready means: runsc is on this node and containerd knows it.
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/ready"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: host
              mountPath: /host
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: host
          hostPath:
            path: /
        - name: scripts
          configMap:
            name: gvisor-installer
