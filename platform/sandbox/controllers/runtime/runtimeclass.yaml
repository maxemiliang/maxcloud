# Pods with `runtimeClassName: gvisor` run under runsc, and get the sandbox
# nodes' selector and toleration from here, so they can't land anywhere else.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    pool: sandbox
  tolerations:
    - key: homelab/pool
      operator: Equal
      value: sandbox
      effect: NoSchedule
