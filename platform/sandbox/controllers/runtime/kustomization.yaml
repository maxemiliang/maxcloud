apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - installer.yaml
  - runtimeclass.yaml
# The name gets a hash of the script, so a changed script restarts the
# installer.
configMapGenerator:
  - name: gvisor-installer
    namespace: sandbox-system
    files:
      - install.sh
