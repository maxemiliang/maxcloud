# One sandbox per user: everything a user needs to run agent sessions,
# generated by the Flux Operator once per entry (a ResourceSetInputProvider
# in flux-system labelled run.gronblom.dev/sandbox, named sandbox-<user>).
# `mcloud sandbox` makes a user's entry the first time they use it;
# admission.yaml ties an entry to the Authelia user who made it.
#
# Per user (entry value `user`, an Authelia username):
#   - the namespace sbx-<user>, Pod Security `restricted`
#   - a limit on running sessions (entry value `sessions`, default 2; only
#     an admin sets it)
#   - network policies: the Claude API and nothing else, nothing in
#   - the session template, and the (empty) pool claims are made on
#   - the user's rights there: claims, a shell in their sessions, their
#     token (rbac.yaml). Nobody else's, so one user can't read another's
#     token.
# The user's Claude subscription token is the Secret claude-code in that
# namespace. `mcloud sandbox token set` writes it; it is in no repo, and
# gone with the namespace.
#
# A separate namespace per user, not one shared: a shell in a session can
# read the token in it, and RBAC limits shells per namespace.
#
# Removing an entry (`mcloud sandbox remove`) deletes the namespace, its
# sessions and the token. Entries aren't backed up: after a cluster rebuild
# users start again.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: maxcloud-sandboxes
  namespace: flux-system
  annotations:
    # Re-apply every 10 minutes, so anything deleted by hand comes back.
    fluxcd.controlplane.io/reconcileEvery: "10m"
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      selector:
        matchLabels:
          run.gronblom.dev/sandbox: "true"
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: maxcloud-sandbox
  resources:
    # Not an app namespace (no run.gronblom.dev/tenant label): none of the
    # run platform's rules or routes apply here.
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: sbx-<< inputs.user >>
        labels:
          pod-security.kubernetes.io/enforce: restricted
          run.gronblom.dev/sandbox: "true"

    # The sandbox node group is one 2-core, 4 GB node (infra/cluster/nodes.tf)
    # and a session requests 250m and 512Mi, so four fit in all. A claim
    # over the limit says ReconcilerError, and its Sandbox has a
    # SandboxPodCreateFailed event ("exceeded quota: sessions").
    - apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: sessions
        namespace: sbx-<< inputs.user >>
      spec:
        hard:
          pods: << get inputs "sessions" | default "2" | quote >>
          # Refused claims stay until they're deleted.
          count/sandboxclaims.extensions.agents.x-k8s.io: "10"
          # Sessions work in an emptyDir.
          persistentvolumeclaims: "0"
          services.loadbalancers: "0"
          services.nodeports: "0"

    # What the pods here may connect to: the two public resolvers, for the
    # Claude API's name only, and that name on 443. Everything else is
    # dropped, the rest of the cluster included.
    #
    # Why it matters: a session carries the user's subscription token in
    # its environment, and runs whatever a prompt or a file talks it into.
    # With this, there is nowhere to send the token but the host it's for.
    #
    # What it doesn't do:
    # - It allows addresses, not names: once the name resolves, any TLS
    #   connection to that address on 443 passes, whatever host it asks for.
    # - Anything sent to the Claude API is allowed, with any credentials.
    #
    # A host added here (a package registry, a git server) is somewhere the
    # token can go: the npm registry accepts uploads, and sits on addresses
    # shared with every other site behind Cloudflare.
    - apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: sandbox-egress
        namespace: sbx-<< inputs.user >>
      spec:
        description: "Sandbox pods: DNS for, and HTTPS to, the Claude API only"
        # Every pod in the namespace. Having an egress section puts them in
        # egress default-deny.
        endpointSelector: {}
        egress:
          # DNS, to the resolvers the template below gives its pods. The dns
          # rules send these packets through Cilium's DNS proxy, which
          # refuses every other name (so DNS can't carry data out either)
          # and learns the addresses the toFQDNs rule then allows.
          - toCIDR:
              - 1.1.1.1/32
              - 9.9.9.9/32
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
                rules:
                  dns:
                    - matchName: api.anthropic.com
          # Model requests. A `claude setup-token` token needs no other
          # Anthropic host (no sign-in, no refresh).
          - toFQDNs:
              - matchName: api.anthropic.com
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
    # Nothing connects to a session: it's driven through exec, which goes
    # through the kubelet, not the pod network.
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny-ingress
        namespace: sbx-<< inputs.user >>
      spec:
        podSelector: {}
        policyTypes: [Ingress]

    # What a session is: one pod under gVisor on the sandbox node group,
    # with Claude Code and the user's token in it.
    - apiVersion: extensions.agents.x-k8s.io/v1beta1
      kind: SandboxTemplate
      metadata:
        name: claude-code
        namespace: sbx-<< inputs.user >>
      spec:
        # Not agent-sandbox's own NetworkPolicy: its default lets a sandbox
        # reach the whole public internet, and policies add up, so it would
        # undo the one above.
        networkPolicyManagement: Unmanaged
        podTemplate:
          spec:
            # Brings the sandbox nodes' selector and toleration with it.
            runtimeClassName: gvisor
            automountServiceAccountToken: false
            enableServiceLinks: false
            # A killed container (out of memory, say) starts again with the
            # work volume as it was.
            restartPolicy: OnFailure
            terminationGracePeriodSeconds: 10
            # Public resolvers, not the cluster's: ClusterIPs time out under
            # gVisor (docs/kb/networking/gvisor-no-clusterip.md), CoreDNS's
            # included. The policy above allows exactly these two.
            dnsPolicy: None
            dnsConfig:
              nameservers: [1.1.1.1, 9.9.9.9]
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: claude
                # Built by .github/workflows/sandbox-image.yaml from
                # sandbox/image. The tag is <Claude Code version>-<image
                # revision>.
                image: ghcr.io/maxemiliang/maxcloud-sandbox:2.1.322-1
                # Does nothing by itself: a session is an exec of `claude`.
                # The trap makes the pod stop at once when it's deleted (as
                # PID 1, sleep alone ignores the signal).
                command: ["sh", "-c", "trap 'exit 0' TERM INT; sleep infinity & wait"]
                env:
                  # A one-year token from `claude setup-token`, model
                  # requests only. Until the user has set one, the pod
                  # stays in CreateContainerConfigError.
                  - name: CLAUDE_CODE_OAUTH_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: claude-code
                        key: CLAUDE_CODE_OAUTH_TOKEN
                  # Claude Code keeps its sessions under ~/.claude: on the
                  # work volume, so `claude --resume` works for as long as
                  # the pod does.
                  - name: HOME
                    value: /work
                  - name: NPM_CONFIG_PREFIX
                    value: /work/.npm-global
                workingDir: /work
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: [ALL]
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                  limits:
                    memory: 1536Mi
                volumeMounts:
                  - name: work
                    mountPath: /work
            volumes:
              # Gone with the pod: ending a session loses its work. Copy out
              # what matters first (mcloud sandbox cp).
              - name: work
                emptyDir:
                  sizeLimit: 5Gi
    # Claims name a pool, not a template. This one holds no idle pods
    # (replicas: 0): every claim starts a new pod, which takes a few seconds
    # once the node has the image. An idle warm pod would hold the token and
    # a quarter of a core for nothing.
    - apiVersion: extensions.agents.x-k8s.io/v1beta1
      kind: SandboxWarmPool
      metadata:
        name: claude-code
        namespace: sbx-<< inputs.user >>
      spec:
        replicas: 0
        sandboxTemplateRef:
          name: claude-code

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: sandbox-user
        namespace: sbx-<< inputs.user >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: maxcloud-sandbox-user
      subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: User
          name: authelia:<< inputs.user >>
