# Four sessions at most. The sandbox node group is one 2-core, 4 GB node
# (infra/cluster/nodes.tf), and a session requests 250m and 512Mi
# (claude-code.yaml). A fifth claim's pod is refused: the claim says
# ReconcilerError, and its Sandbox has a SandboxPodCreateFailed event
# ("exceeded quota: sessions").
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sessions
  namespace: sandbox
spec:
  hard:
    pods: "4"
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.memory: 6Gi
    # Sessions work in an emptyDir. A template that keeps the work on a
    # volume needs these raised.
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
