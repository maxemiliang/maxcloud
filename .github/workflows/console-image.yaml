# The web console's image: builds console/ and pushes it to
# ghcr.io/maxemiliang/maxcloud-console:<version>, the version in
# console/package.json. The cluster runs the tag named in
# platform/apps/console/service.yaml, so a new console is two steps: raise
# the version here and merge (this builds it), then name the new tag there
# (Renovate offers that as a PR once the tag exists). The package has to be
# public: the cluster pulls it without credentials.
#
# A tag is never built twice: change console/ without a new version and it
# builds, runs, and nothing is pushed.
#
# Pull requests build the image and run it, without pushing. The console's
# tests are ci.yaml's job `console`.
name: console-image

on:
  push:
    branches: [main]
    paths: ["console/**", ".github/workflows/console-image.yaml"]
  pull_request:
    paths: ["console/**", ".github/workflows/console-image.yaml"]
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/maxemiliang/maxcloud-console

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          version=$(jq -r .version console/package.json)
          echo "TAG=${version}" >>"$GITHUB_ENV"
          docker build \
            --label org.opencontainers.image.source=https://github.com/maxemiliang/maxcloud \
            --label org.opencontainers.image.version="${version}" \
            -t "${IMAGE}:${version}" console
      - name: Run it
        run: |
          # As the pod runs it: a plain user, no capabilities, nothing to
          # write to.
          run=(docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges -u 65532:65532)
          # Without a cookie-sealing key it must not start.
          if out=$("${run[@]}" -e CONSOLE_ORIGIN=https://console.example.com "${IMAGE}:${TAG}" 2>&1); then
            echo "::error::the console started without CONSOLE_SESSION_KEY"; exit 1
          fi
          echo "$out"
          case "$out" in *CONSOLE_SESSION_KEY*) ;; *) echo "::error::it didn't say why it won't start"; exit 1 ;; esac
          # With one it serves, and sends a visitor without a login to log in.
          "${run[@]}" -d --name console -p 127.0.0.1:8080:8080 \
            -e CONSOLE_ORIGIN=https://console.example.com -e CONSOLE_SESSION_KEY="$(openssl rand -base64 32)" \
            "${IMAGE}:${TAG}"
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = 200 ] && break
            sleep 0.5
          done
          test "$(curl -s http://127.0.0.1:8080/healthz)" = ok
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8080/)" = "302 http://127.0.0.1:8080/login"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/apps)" = 401
          # It stops when told to (a pod that ignores SIGTERM shows as Error).
          docker stop -t 5 console
      - name: Push, unless the tag exists
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "::notice::${IMAGE}:${TAG} is already there: nothing pushed. Raise the version in console/package.json to publish this build."
            exit 0
          fi
          docker push "${IMAGE}:${TAG}"
