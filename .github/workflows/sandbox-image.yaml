# The image agent sessions run in: builds platform/sandbox/image and pushes it
# to ghcr.io/maxemiliang/maxcloud-sandbox:<Claude Code version>-<revision>.
# The cluster runs the tag named in platform/sandbox/sessions/users.yaml,
# so a new image is two steps: change a version here and merge (this
# builds it), then name the new tag there (Renovate offers that as a PR once
# the tag exists).
#
# A tag is never built twice: change the Dockerfile without a new Claude
# Code version, and IMAGE_REVISION goes up by one.
#
# Pull requests build the image and run it, without pushing.
name: sandbox-image

on:
  push:
    branches: [main]
    paths: ["platform/sandbox/image/**", ".github/workflows/sandbox-image.yaml"]
  pull_request:
    paths: ["platform/sandbox/image/**", ".github/workflows/sandbox-image.yaml"]
  workflow_dispatch:

permissions: {}

env:
  # renovate: datasource=npm depName=@anthropic-ai/claude-code
  CLAUDE_CODE_VERSION: 2.1.322
  IMAGE_REVISION: 2
  IMAGE: ghcr.io/maxemiliang/maxcloud-sandbox

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          tag="${CLAUDE_CODE_VERSION}-${IMAGE_REVISION}"
          echo "TAG=${tag}" >>"$GITHUB_ENV"
          docker build --build-arg CLAUDE_CODE_VERSION="${CLAUDE_CODE_VERSION}" \
            --label org.opencontainers.image.source=https://github.com/maxemiliang/maxcloud \
            --label org.opencontainers.image.version="${tag}" \
            -t "${IMAGE}:${tag}" platform/sandbox/image
      - name: Run it
        run: |
          got=$(docker run --rm "${IMAGE}:${TAG}" claude --version)
          echo "$got"
          case "$got" in
            "${CLAUDE_CODE_VERSION} "*) ;;
            *) echo "::error::the image has Claude Code '${got}', not ${CLAUDE_CODE_VERSION}"; exit 1 ;;
          esac
          # Then as a session runs it: uid 1000, no capabilities, HOME on an
          # empty directory, as /work is. Offline: no installs, only what the
          # image has and what a session can build with it.
          work=$(mktemp -d)
          chmod 0777 "$work"
          docker run --rm -i -u 1000:1000 --cap-drop ALL --security-opt no-new-privileges \
            -e HOME=/work -e NPM_CONFIG_PREFIX=/work/.npm-global -v "$work:/work" -w /work \
            "${IMAGE}:${TAG}" bash -eu -o pipefail -s <<'EOF'
          test "$(id -u)" = 1000
          test -z "$(ls -A "$HOME")"

          for tool in claude node npm pnpm yarn python python3 pip uv uvx go gofmt \
            gcc g++ make cmake ninja pkg-config git gh rg fd jq curl wget sqlite3 \
            zip unzip xz tree less nano; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is not in the image"; exit 1; }
          done
          node --version; pnpm --version; python --version; uv --version; go version
          gcc --version | head -1; cmake --version | head -1; git --version; gh --version | head -1
          rg --version | head -1; jq --version

          # What each toolchain builds and runs, with HOME as the only place to write.
          printf '#include <stdio.h>\nint main(void){puts("c");return 0;}\n' >a.c
          gcc a.c -o a && ./a
          mkdir g && (cd g && go mod init example.com/g && printf 'package main\nfunc main(){println("go")}\n' >main.go && go run .)
          python3 -m venv v && ./v/bin/python -c 'print("python")'
          node -e 'console.log("node")'

          # The directories a session installs into are on PATH.
          for d in .local/bin .npm-global/bin .cargo/bin go/bin; do
            name="probe-$(echo "$d" | tr -c 'a-z\n' _)"
            mkdir -p "$HOME/$d"
            printf '#!/bin/sh\n' >"$HOME/$d/$name"
            chmod +x "$HOME/$d/$name"
            command -v "$name" >/dev/null || { echo "::error::$HOME/$d is not on PATH"; exit 1; }
          done
          EOF
      - name: Push, unless the tag exists
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "::notice::${IMAGE}:${TAG} is already there: nothing pushed. Raise IMAGE_REVISION to publish this build."
            exit 0
          fi
          docker push "${IMAGE}:${TAG}"
