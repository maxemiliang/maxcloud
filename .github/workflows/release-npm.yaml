# npm releases of @max-cloud/functions (functions-js/v* tags) and
# @max-cloud/nuxt (nuxt-js/v*). release-please (release-please.yaml) calls
# this when a release PR with either package in it is merged.
#
# No npm token: npm trusts the workflow that calls this one (trusted
# publishing, OIDC). On npmjs.com, each package's Settings, Trusted
# publisher: GitHub Actions, maxemiliang/maxcloud, workflow
# release-please.yaml. npm checks the calling workflow's name, so tags pushed
# by hand don't publish. Packages published this way carry provenance
# (which commit and workflow built them).
#
# Two jobs, so that installing, building and testing (npm ci runs the
# dependencies' install scripts, the tests run nuxt build) never has
# id-token: write, which is what lets a job publish. build packs the
# package and hands the tarball over as an artifact; publish only uploads
# that tarball, without a checkout, npm ci or any package's scripts.
name: release-npm

on:
  workflow_call:
    inputs:
      tag:
        description: The functions-js/v* or nuxt-js/v* tag to publish
        type: string
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    outputs:
      artifact: ${{ steps.which.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Which package
        id: which
        run: |
          case "$TAG" in
            functions-js/v*) echo "PKG=packages/functions" >> "$GITHUB_ENV" ;;
            nuxt-js/v*) echo "PKG=packages/nuxt" >> "$GITHUB_ENV" ;;
            *) echo "::error::unknown tag $TAG"; exit 1 ;;
          esac
          # Unique per tag: release-please calls this workflow for both
          # packages in the same run.
          echo "artifact=npm-${TAG%%/*}" >> "$GITHUB_OUTPUT"
      - name: Tag matches package.json
        run: |
          cd "$PKG"
          want="${TAG#*-js/v}"
          have=$(node -p 'require("./package.json").version')
          if [ "$want" != "$have" ]; then
            echo "::error::tag says $want, package.json says $have"
            exit 1
          fi
      - run: npm ci
      # Both: @max-cloud/nuxt builds against @max-cloud/functions' dist.
      - run: npm run build --workspaces
      - run: npm run typecheck --workspace "$PKG"
      - run: npm test --workspace "$PKG"
      - name: Pack
        run: |
          mkdir "$RUNNER_TEMP/pack"
          npm pack --workspace "$PKG" --pack-destination "$RUNNER_TEMP/pack"
          ls -l "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.which.outputs.artifact }}
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing, and provenance
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/pack
      # The tarball as build packed it, if it's the one the tag names; no
      # package's scripts run.
      - name: Publish
        run: |
          case "$TAG" in
            functions-js/v*) want="max-cloud-functions-${TAG#*/v}.tgz" ;;
            nuxt-js/v*) want="max-cloud-nuxt-${TAG#*/v}.tgz" ;;
            *) echo "::error::unknown tag $TAG"; exit 1 ;;
          esac
          set -- "$RUNNER_TEMP"/pack/*.tgz
          if [ "$#" -ne 1 ] || [ "$(basename "$1")" != "$want" ]; then
            echo "::error::want $want, got: $*"
            exit 1
          fi
          npm publish "$1" --access public --provenance --ignore-scripts
