# npm releases: a tag matching the version in the package's package.json
# publishes it.
#
#   git tag functions-js/v0.2.0 && git push origin functions-js/v0.2.0   # @max-cloud/functions
#   git tag nuxt-js/v0.1.0 && git push origin nuxt-js/v0.1.0             # @max-cloud/nuxt
#
# @max-cloud/nuxt depends on @max-cloud/functions: release that first when
# it needs a newer one.
#
# No npm token: npm trusts this workflow (trusted publishing, OIDC), set up
# on npmjs.com under the package's Settings, Trusted publisher: GitHub
# Actions, maxemiliang/maxcloud, workflow release-npm.yaml. Packages
# published this way carry provenance (which commit and workflow built them).
name: release-npm

on:
  push:
    tags: ["functions-js/v*", "nuxt-js/v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Which package
        run: |
          case "$GITHUB_REF_NAME" in
            functions-js/v*) echo "PKG=packages/functions" >> "$GITHUB_ENV" ;;
            nuxt-js/v*) echo "PKG=packages/nuxt" >> "$GITHUB_ENV" ;;
            *) echo "::error::unknown tag $GITHUB_REF_NAME"; exit 1 ;;
          esac
      - name: Tag matches package.json
        run: |
          cd "$PKG"
          want="${GITHUB_REF_NAME#*-js/v}"
          have=$(node -p 'require("./package.json").version')
          if [ "$want" != "$have" ]; then
            echo "::error::tag says $want, package.json says $have"
            exit 1
          fi
      - run: npm ci
      - run: npm run build --workspaces
      - run: npm run typecheck --workspace "$PKG"
      - run: npm test --workspace "$PKG"
      - name: Publish
        run: cd "$PKG" && npm publish --access public
