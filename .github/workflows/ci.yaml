# Every push and pull request: the code is formatted, vets clean, the tests
# pass and mcloud builds. Changes only to the cluster (platform/) are
# checked by platform.yaml instead.
name: ci

on:
  pull_request:
    paths-ignore: ["platform/**"]
  push:
    branches: [main]
    paths-ignore: ["platform/**"]

permissions:
  contents: read

jobs:
  # The Go checks run as separate jobs, in parallel: the three modules don't
  # depend on each other, and vet and test -race each compile every dependency
  # (test -race with instrumentation), so in one job they wait on each other.
  # Each job keeps its own cache (.github/actions/setup-go).

  mcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          module: .
      # The whole repository: functions/ and controller/ too.
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./cmd/mcloud

  # docs/reference is generated from the commands' help, maxcloud.schema.json
  # and the controller's CRDs (CONTRIBUTING.md, Docs).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          module: .
      - run: go run ./internal/gendocs
      - name: docs/reference is up to date
        run: |
          git add -N docs/reference
          git diff --exit-code -- docs/reference || { echo "::error::run go run ./internal/gendocs and commit"; exit 1; }

  mcloud-test:
    runs-on: ubuntu-latest
    # The migration tests run against a real Postgres.
    services:
      postgres: &postgres
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          module: .
      - run: go test -race ./...

  # The Go SDK is its own module (functions/), so apps don't pull in mcloud's
  # dependencies. Small enough that vet and test share a job.
  sdk:
    runs-on: ubuntu-latest
    # The queue tests run against a real Postgres.
    services:
      postgres: *postgres
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          module: functions
      - run: go vet ./...
      - run: go test -race ./...

  # The controller is its own module too (controller/): Kubernetes and AWS
  # libraries stay out of mcloud and the SDK.
  controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          module: controller
      - run: go vet ./...
      - run: go build ./cmd/maxcloud-controller
      - name: Generated files are up to date
        run: |
          go tool controller-gen object paths=./api/...
          go tool controller-gen crd rbac:roleName=maxcloud-controller paths=./... output:crd:dir=config/crd output:rbac:dir=config/rbac
          git diff --exit-code -- . || { echo "::error::run the controller-gen commands in controller/README.md and commit"; exit 1; }

  controller-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          module: controller
      - run: go test -race ./...

  node:
    runs-on: ubuntu-latest
    # The queue tests run against a real Postgres.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Built first: @max-cloud/nuxt imports @max-cloud/functions' dist (npm
      # runs the workspaces in folder order, functions before nuxt), and its
      # fixture test loads its own.
      - run: npm run build --workspaces
      - run: npm run typecheck --workspaces
      - run: npm test --workspaces
      - run: npm pack --dry-run --workspaces
