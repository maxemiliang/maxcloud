# Reusable workflow: deploys an app to maxcloud. An app repo calls it on
# every push to main (mcloud init writes the caller), and grants it
# `contents: write` (the deploy commit) and `id-token: write` (pushing to
# the maxcloud registry as the repo itself).
#
# The work is `mcloud build --ci`, the same build mcloud's direct deploys
# run:
#   1. Builds the repo into an image, with its Dockerfile if it has one,
#      otherwise with Cloud Native Buildpacks (Paketo: Go, Node.js, Python,
#      Java, .NET, Ruby, PHP, ...).
#   2. Pushes it to the maxcloud registry, registry.gronblom.dev/<app>/<app>
#      (app: from maxcloud.yaml), tagged with the commit SHA. mcloud is
#      docker's credential helper, logging in with a fresh GitHub Actions
#      OIDC token each time; the registry lets the repo its app's registry
#      entry names push.
#   3. For an app written with maxcloud functions (`functions: true`), asks
#      the image what its functions are and writes their manifests.
#   4. Pins the image by digest in the repo's deploy manifests and commits.
#      Flux applies the commit (the app's registry entry points it there).
#
# It lives in this public repo so that public and private app repos alike
# can call it (a public repo can't use a private repo's workflows).
name: run-deploy

on:
  workflow_call:
    inputs:
      context:
        description: Directory to build, relative to the repo root.
        type: string
        default: .
      manifests:
        description: Kustomize directory that Flux applies.
        type: string
        default: deploy/k8s
      image:
        description: Image name used in the manifests, replaced with the built image.
        type: string
        default: app
      functions:
        description: >-
          The app is written with maxcloud functions (@max-cloud/functions, or
          the Go functions package): generate its manifests from the image on
          every deploy.
        type: boolean
        default: false
      app:
        description: The app's name on maxcloud; default, `app:` in maxcloud.yaml.
        type: string
        default: ""
      registry:
        description: The maxcloud registry's host.
        type: string
        default: registry.gronblom.dev
      mcloud-version:
        description: >-
          The mcloud release that builds (e.g. v0.10.0); default, the newest.
          The workflow itself comes from main, so the newest mcloud matches it.
        type: string
        default: latest

# No permissions here: the job gets the caller's (contents: write and
# id-token: write).
jobs:
  deploy:
    # Not ubuntu-latest: on ubuntu-26.04 (latest since November 2026) pack
    # can't read the builder image it just pulled ("failed to fetch base
    # layers: open /tmp/imgutil.local.image...: no such file or
    # directory"). Every deploy before worked on 24.04.
    runs-on: ubuntu-24.04
    # One deploy at a time per repo; a newer push waits rather than racing
    # the deploy commit of an older one.
    concurrency:
      group: run-deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Builder
        id: builder
        run: |
          if [ -f "${{ inputs.context }}/Dockerfile" ]; then
            echo "kind=dockerfile" >>"$GITHUB_OUTPUT"
          else
            echo "kind=buildpacks" >>"$GITHUB_OUTPUT"
          fi

      # A container builder, so mcloud can keep the build cache in the
      # registry.
      - if: steps.builder.outputs.kind == 'dockerfile'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.builder.outputs.kind == 'buildpacks'
        uses: buildpacks/github-actions/setup-pack@91cb4574e7b781941b4e3fa950e541e4b8754b3a # v6.2.2

      - name: Install mcloud
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.mcloud-version }}
        run: |
          if [ "$VERSION" = latest ]; then
            # The repo also tags the controller and the SDKs; mcloud's are v*.
            VERSION=$(gh api repos/maxemiliang/maxcloud/releases --jq '[.[] | select(.tag_name | startswith("v")) | select(.draft | not)][0].tag_name')
          fi
          echo "mcloud ${VERSION}"
          file="mcloud_${VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/maxemiliang/maxcloud/releases/download/${VERSION}"
          mkdir -p "$RUNNER_TEMP/bin"
          (cd "$RUNNER_TEMP" &&
            curl -sSfL -O "${base}/${file}" -O "${base}/checksums.txt" &&
            grep " ${file}\$" checksums.txt | sha256sum -c - &&
            tar -xzf "$file" -C "$RUNNER_TEMP/bin" mcloud)
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      # kustomize (for pinning the image) is on GitHub's Ubuntu runners.
      - name: Build, push and commit the deploy
        env:
          MCLOUD_IMAGE_REGISTRY: ${{ inputs.registry }}
          CONTEXT: ${{ inputs.context }}
          MANIFESTS: ${{ inputs.manifests }}
          IMAGE: ${{ inputs.image }}
          APP: ${{ inputs.app }}
          FUNCTIONS: ${{ inputs.functions }}
        run: |
          mcloud build --ci --context "$CONTEXT" --manifests "$MANIFESTS" --image "$IMAGE" \
            --app "$APP" --functions="$FUNCTIONS"
