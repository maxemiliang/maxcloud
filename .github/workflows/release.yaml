# mcloud releases: builds the binaries (linux, macOS; amd64, arm64) for a v*
# tag and adds them to its GitHub release (.goreleaser.yaml). release-please
# (release-please.yaml) calls it when a release PR with mcloud in it is
# merged; pushing a v* tag by hand still works.
name: release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The v* tag to release
        type: string
        required: true

permissions: {}

jobs:
  mcloud:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # the changelog needs the history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A release commit carries every component's tag; this is mcloud's.
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
