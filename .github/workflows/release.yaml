# mcloud releases: a v* tag builds the binaries (linux, macOS; amd64, arm64)
# and publishes them as a GitHub release (.goreleaser.yaml).
#
#   git tag v0.2.0 && git push origin v0.2.0
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  mcloud:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs the history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
