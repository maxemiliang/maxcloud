# mcloud releases: release-please tags v* and makes the GitHub release as a
# draft, and .github/workflows/release.yaml runs GoReleaser, which adds the
# binaries to it and then publishes it. The other parts' tags (functions/v*,
# functions-js/v*, nuxt-js/v*, controller/v*) aren't mcloud's.
version: 2

project_name: mcloud

git:
  ignore_tags:
    - "functions/*"
    - "functions-js/*"
    - "nuxt-js/*"
    - "controller/*"

builds:
  - main: ./cmd/mcloud
    binary: mcloud
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/maxemiliang/maxcloud/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    # mcloud_0.2.0_linux_amd64.tar.gz: what mise's github backend and
    # run-deploy.yaml look for.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"
      - "^test"

release:
  # release-please made the release, with its changelog: add the binaries
  # and leave the notes alone.
  mode: keep-existing
  # That release is a draft (release-please-config.json), found by its name,
  # which is the tag. GoReleaser publishes it once every binary is uploaded,
  # so nobody sees a release without them: mise's release proxy caches what
  # it sees for half an hour, and run-deploy.yaml installs the newest
  # published release. With no draft (a tag pushed by hand) it makes the
  # release itself, the same way.
  use_existing_draft: true
  # A rerun after a failed upload replaces what the first run left behind.
  replace_existing_artifacts: true
